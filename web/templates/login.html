{{define "content"}}
<main class="login">
  <h1 class="wordmark">Spark</h1>
  <form method="post" action="/login">
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" value="{{.Username}}" required {{if not .Username}}autofocus{{end}}>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required {{if .Username}}autofocus{{end}}>
    <button type="submit">Log in</button>
  </form>
</main>
{{end}}
